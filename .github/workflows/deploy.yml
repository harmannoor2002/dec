name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPO_BACKEND: 203783636897.dkr.ecr.us-east-1.amazonaws.com/my-backend-repo
  ECR_REPO_FRONTEND: 203783636897.dkr.ecr.us-east-1.amazonaws.com/my-frontend-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Login to AWS ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4️⃣ Build Docker Images
      - name: Build Docker images
        run: |
          docker build -t my-backend:latest backend/
          docker build -t my-frontend:latest frontend/

      # 5️⃣ Tag Docker Images
      - name: Tag Docker images
        run: |
          docker tag my-backend:latest $ECR_REPO_BACKEND:latest
          docker tag my-frontend:latest $ECR_REPO_FRONTEND:latest

      # 6️⃣ Push Images to ECR
      - name: Push images to ECR
        run: |
          docker push $ECR_REPO_BACKEND:latest
          docker push $ECR_REPO_FRONTEND:latest

      # 7️⃣ Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: harmannoor2002
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/harmannoor2002/dec
            docker-compose down
            docker-compose pull
            docker-compose up -d
